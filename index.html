  <style>
    :root{--black:#050506;--gold:#c79a45;--goldBright:#f0c96e;--goldLine:rgba(199,154,69,.44);--ivory:#f4eee2;--cream:#ded4c4;--muted:#b2a899;--sage:#94b598;--sageBg:rgba(77,119,88,.28);--error:#ffd2cd;--errorBg:rgba(128,49,42,.30);--shadow:0 22px 55px rgba(0,0,0,.48)}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ivory);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 18%,rgba(199,154,69,.13),transparent 22%),radial-gradient(circle at 87% 10%,rgba(199,154,69,.08),transparent 21%),linear-gradient(145deg,#030304 0%,#090809 52%,#050506 100%)}.shell{max-width:1210px;margin:0 auto;padding:30px 18px 54px}header{position:relative;overflow:hidden;margin-bottom:22px;padding:30px 32px 32px;border:1px solid var(--goldLine);border-radius:18px;background:radial-gradient(circle at 10% 125%,rgba(199,154,69,.20),transparent 34%),radial-gradient(circle at 94% -15%,rgba(199,154,69,.15),transparent 29%),linear-gradient(130deg,#070607,#111013 58%,#0b0a0c);box-shadow:var(--shadow)}header::after{content:"";position:absolute;width:440px;height:440px;right:-170px;top:-260px;border:1px solid rgba(199,154,69,.23);border-radius:50%;box-shadow:0 0 0 48px rgba(199,154,69,.035),0 0 0 96px rgba(199,154,69,.022);pointer-events:none}.brand{display:flex;align-items:center;gap:11px;color:var(--goldBright);font-size:.76rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.brand-mark{display:grid;place-items:center;width:31px;height:31px;border:1px solid var(--goldLine);border-radius:50%;color:var(--goldBright);font-size:1rem}h1{position:relative;z-index:1;margin:17px 0 8px;color:var(--ivory);font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,4vw,3rem);font-weight:500;letter-spacing:-.045em}.lead{position:relative;z-index:1;max-width:850px;margin:0;color:var(--cream);line-height:1.6}.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(355px,.9fr);gap:20px;al <body>
  <main class="shell">
    <header><div class="brand"><span class="brand-mark">✦</span> Wealth Assistance Presents</div><h1>Acceleration Account Calculator</h1><p class="lead">See a traditional mortgage payoff alongside an Acceleration Account payoff projection.</p></header>
    <div class="grid">
      <section class="card"><form id="calculatorForm" novalidate>
        <h2>Mortgage</h2><div class="fields"><label>Current mortgage balance<input id="mortgageBalance" type="number" min="0" step="0.01" placeholder="e.g., 250000" required></label><label>Mortgage interest rate (APR %)<input id="mortgageRate" type="number" min="0" max="100" step="0.001" placeholder="e.g., 6.5" required></label><label>Remaining mortgage term (years)<input id="mortgageYears" type="number" min="0.1" max="50" step="0.1" placeholder="e.g., 25" required></label><label>Mortgage payment day<select id="mortgageDay"></select></label></div>
        <h3>Acceleration Account</h3><div class="fields"><label>Approved account capacity<input id="accountCapacity" type="number" min="0" step="0.01" placeholder="e.g., 75000" required></label><label>Current account balance owed<input id="accountBalance" type="number" min="0" step="0.01" placeholder="e.g., 0" required></label><label>Account interest rate (APR %)<input id="accountRate" type="number" min="0" max="100" step="0.001" placeholder="e.g., 8.5" required></label><label>Advance percentage of unused capacity<input id="advancePercent" type="number" min="0" max="100" step="1" placeholder="e.g., 50" required></label></div>
        <h3>Income</h3><div class="income-row"><label>Income 1 amount<input id="income1Amount" type="number" min="0" step="0.01" placeholder="e.g., 1000"></label><label>Frequency<select id="income1Frequency"><option value="weekly">Weekly</option><option value="biweekly">Biweekly</option><option value="monthly" selected>Monthly</option></select></label></div><div class="income-row"><label>Income 2 amount<input id="income2Amount" type="number" min="0" step="0.01" placeholder="Optional"></label><label>Frequency<select id="income2Frequency"><option value="weekly">Weekly</option><option value="biweekly">Biweekly</option><option value="monthly" selected>Monthly</option></select></label></div><div class="income-row"><label>Income 3 amount<input id="income3Amount" type="number" min="0" step="0.01" placeholder="Optional"></label><label>Frequency<select id="income3Frequency"><option value="weekly">Weekly</option><option value="biweekly">Biweekly</option><option value="monthly" selected>Monthly</option></select></label></div>
        <h3>Monthly expenses</h3><div class="fields one"><label>Total general monthly expenses<input id="monthlyExpenses" type="number" min="0" step="0.01" placeholder="e.g., 2000"></label></div><button class="button" type="submit">Calculate payoff projection</button>
      </form></section>
      <aside class="card" aria-live="polite"><h2>Projection results</h2><div id="results"><p class="empty">Enter your figures and select <strong>Calculate payoff projection</strong>.</p></div></aside>
    </div>
  </main>
  <script>
    (()=>{
      const DAY_MS=86400000,MAX_DAYS=365*80,EPS=.004;
      const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}),number=new Intl.NumberFormat('en-US',{maximumFractionDigits:0}),dateFormat=new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'numeric'});
      const el=id=>document.getElementById(id),value=id=>{const raw=el(id).value.trim();return raw===''?0:Math.max(0,Number(raw)||0)},round=x=>Math.round((x+Number.EPSILON)*100)/100,zero=x=>Math.abs(x)<.005?0:x,formatMoney=x=>money.format(zero(x)),formatDate=d=>dateFormat.format(d),normalize=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()),sameDate=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(),lastDay=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),monthlyDate=(y,m,day)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate())),daysBetween=(a,b)=>Math.round((normalize(a)-normalize(b))/DAY_MS),monthlyAnniversary=(date,start)=>date.getDate()===Math.min(start.getDate(),lastDay(date));
      const mortgageDay=el('mortgageDay');for(let i=1;i<=31;i++){const o=document.createElement('option');o.value=i;o.textContent=`Day ${i}`;if(i===1)o.selected=true;mortgageDay.appendChild(o)}document.querySelectorAll('input[type="number"]').forEach(input=>input.addEventListener('focus',()=>setTimeout(()=>input.select(),0)));
      const monthlyIncome=incomes=>incomes.reduce((total,income)=>total+(!income.amount?0:income.frequency==='weekly'?income.amount*52/12:income.frequency==='biweekly'?income.amount*26/12:income.amount),0);
      const mortgagePayment=(principal,annualRate,years)=>{const months=Math.max(1,Math.round(years*12)),rate=annualRate/12;return rate===0?principal/months:principal*(rate*Math.pow(1+rate,months))/(Math.pow(1+rate,months)-1)};
      const firstMortgage=(start,day)=>{const candidate=monthlyDate(start.getFullYear(),start.getMonth(),day);return candidate>=start?candidate:monthlyDate(start.getFullYear(),start.getMonth()+1,day)};
      const showError=message=>el('results').innerHTML=`<div class="notice error">${message}</div>`;
      function traditional(inputs,start,payment){let balance=inputs.mortgageBalance,interestTotal=0,next=firstMortgage(start,inputs.mortgageDay),paidOff=null,daily=[];for(let step=0;step<MAX_DAYS;step++){const date=new Date(start.getFullYear(),start.getMonth(),start.getDate()+step);if(sameDate(date,next)&&balance>EPS){const interest=round(balance*(inputs.mortgageRate/100/12)),pay=round(Math.min(balance+interest,payment)),principal=round(Math.max(0,pay-interest));balance=round(Math.max(0,balance-principal));interestTotal=round(interestTotal+interest);next=monthlyDate(date.getFullYear(),date.getMonth()+1,inputs.mortgageDay)}daily.push({date:new Date(date),debt:balance});if(balance<=EPS){daily[daily.length-1].debt=0;paidOff=new Date(date);break}}return{daily,interestTotal,paidOff}}
      function strategy(inputs,start,payment){
        let mortgage=inputs.mortgageBalance,heloc=inputs.currentAccountBalance,accrued=0,mortgageInterest=0,helocInterest=0,incomeApplied=0,expenses=0,next=firstMortgage(start,inputs.mortgageDay),mortgagePaid=null,paidOff=null;
        const daily=[{date:new Date(start),debt:round(mortgage+heloc),mortgage:round(mortgage),heloc:round(heloc)}];
        function transferForIncome(){
          if(mortgage<=EPS)return 0;
          const available=Math.max(0,inputs.accountCapacity-heloc);
          const proposed=available*(inputs.advancePercent/100);
          const draw=round(Math.min(proposed,available,mortgage));
          if(draw<=EPS)return 0;
          heloc=round(heloc+draw);mortgage=round(Math.max(0,mortgage-draw));
          if(mortgage===0&&!mortgagePaid)mortgagePaid=new Date(currentDate);
          return draw;
        }
        let currentDate=start;
        for(let step=0;step<MAX_DAYS;step++){
          const date=new Date(start.getFullYear(),start.getMonth(),start.getDate()+step);currentDate=date;
          const monthEnd=date.getDate()===lastDay(date);let incomeToday=0;
          for(const income of inputs.incomes){if(!income.amount)continue;const due=income.frequency==='weekly'?daysBetween(date,start)%7===0:income.frequency==='biweekly'?daysBetween(date,start)%14===0:monthlyAnniversary(date,start);if(due)incomeToday=round(incomeToday+income.amount)}

          // Process every dollar of each scheduled income deposit. If a deposit clears the active Account balance,
          // a debt-neutral mortgage-to-Account transfer is made and the remaining income continues reducing debt.
          let remainingIncome=incomeToday;let guard=0;
          while(remainingIncome>EPS&&(mortgage>EPS||heloc>EPS)){
            if(heloc>EPS){const applied=round(Math.min(remainingIncome,heloc));heloc=round(Math.max(0,heloc-applied));remainingIncome=round(remainingIncome-applied);incomeApplied=round(incomeApplied+applied);continue;}
            if(mortgage>EPS){const draw=transferForIncome();if(draw<=EPS)break;guard++;if(guard>1000)return{error:'The projection could not process an income transfer cycle. Review account capacity and transfer percentage.'};continue;}
            break;
          }

          if(date.getDate()===15&&inputs.monthlyExpenses>EPS){if(heloc+inputs.monthlyExpenses>inputs.accountCapacity+.005)return{error:`The Acceleration Account reaches its approved capacity on ${formatDate(date)}. Adjust capacity, income, expenses, or transfer percentage.`};heloc=round(heloc+inputs.monthlyExpenses);expenses=round(expenses+inputs.monthlyExpenses)}
          if(sameDate(date,next)&&mortgage>EPS){const interest=round(mortgage*(inputs.mortgageRate/100/12)),due=round(Math.min(mortgage+interest,payment));if(heloc+due>inputs.accountCapacity+.005)return{error:`The Acceleration Account reaches its approved capacity on ${formatDate(date)} while processing the regular mortgage payment. Adjust capacity, income, expenses, or transfer percentage.`};const principal=round(Math.max(0,due-interest));heloc=round(heloc+due);mortgage=round(Math.max(0,mortgage-principal));mortgageInterest=round(mortgageInterest+interest);if(mortgage===0&&!mortgagePaid)mortgagePaid=new Date(date);next=monthlyDate(date.getFullYear(),date.getMonth()+1,inputs.mortgageDay)}
          if(heloc>EPS)accrued+=heloc*(inputs.accountRate/100/365);
          if(monthEnd){const charge=round(accrued);if(charge>EPS){if(heloc+charge>inputs.accountCapacity+.005)return{error:`The Acceleration Account reaches its approved capacity on ${formatDate(date)} after account interest is posted. Adjust capacity, income, expenses, or transfer percentage.`};heloc=round(heloc+charge);helocInterest=round(helocInterest+charge)}accrued=0}
          const ending={date:new Date(date),debt:round(mortgage+heloc),mortgage:round(mortgage),heloc:round(heloc)};if(mortgage<=EPS&&heloc<=EPS){mortgage=heloc=0;ending.debt=0;ending.mortgage=0;ending.heloc=0;paidOff=new Date(date)}daily.push(ending);if(paidOff)break;
        }
        return paidOff?{daily,mortgageInterest,helocInterest,incomeApplied,expenses,mortgagePaid,paidOff}:{error:'The projection did not reach zero within 80 years. Review income, expenses, capacity, rates, and transfer percentage.'};
      }
      function calculate(inputs){const start=normalize(new Date()),payment=mortgagePayment(inputs.mortgageBalance,inputs.mortgageRate/100,inputs.mortgageYears),income=monthlyIncome(inputs.incomes);if(inputs.mortgageBalance<=0)return{error:'Enter a current mortgage balance greater than zero.'};if(inputs.accountCapacity<=0)return{error:'Enter an approved account capacity greater than zero.'};if(inputs.currentAccountBalance>inputs.accountCapacity+.005)return{error:'The current account balance cannot exceed approved account capacity.'};if(inputs.mortgageYears<=0)return{error:'Enter a remaining mortgage term greater than zero.'};if(income<=0)return{error:'Enter at least one income amount greater than zero.'};if(inputs.advancePercent<=0)return{error:'Enter an advance percentage greater than zero.'};const base=traditional(inputs,start,payment),accel=strategy(inputs,start,payment);if(accel.error)return accel;const totalInterest=round(accel.mortgageInterest+accel.helocInterest),days=Math.round((accel.paidOff-start)/DAY_MS),monthsSaved=Math.max(0,Math.round((base.paidOff-accel.paidOff)/DAY_MS/30.4375)),years=Math.floor(days/365.2425),months=Math.floor((days-years*365.2425)/30.4375);return{start,payment,income,base,accel,totalInterest,interestSaved:round(base.interestTotal-totalInterest),monthsSaved,years,months}}
      function canvasSize(canvas){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w:rect.width,h:rect.height}}function text(ctx,value,x,y,align='left'){ctx.textAlign=align;ctx.fillStyle='#b2a899';ctx.font='11px Inter,system-ui,sans-serif';ctx.fillText(value,x,y)}function grid(ctx,w,h,p,max){ctx.strokeStyle='rgba(199,154,69,.24)';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=p.t+(h-p.t-p.b)*i/4;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(w-p.r,y);ctx.stroke();text(ctx,formatMoney(max*(1-i/4)),p.l-7,y+4,'right')}}
      function interestChart(){const canvas=el('interestChart');if(!canvas)return;const{ctx,w,h}=canvasSize(canvas),r=window.result,p={l:52,r:20,t:26,b:43},ch=h-p.t-p.b,cw=w-p.l-p.r,max=Math.max(r.base.interestTotal,r.totalInterest,1)*1.12;ctx.clearRect(0,0,w,h);grid(ctx,w,h,p,max);const centers=[p.l+cw*.25,p.l+cw*.75],bw=Math.min(84,cw*.22),baseH=ch*r.base.interestTotal/max,mortH=ch*r.accel.mortgageInterest/max,helocH=ch*r.accel.helocInterest/max,baseY=p.t+ch-baseH,accelY=p.t+ch-mortH-helocH;ctx.fillStyle='#8c8883';ctx.fillRect(centers[0]-bw/2,baseY,bw,baseH);ctx.fillStyle='#c79a45';ctx.fillRect(centers[1]-bw/2,p.t+ch-mortH,bw,mortH);ctx.fillStyle='#24475b';ctx.fillRect(centers[1]-bw/2,accelY,bw,helocH);ctx.fillStyle='#f4eee2';ctx.font='700 11px Inter,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(formatMoney(r.base.interestTotal),centers[0],Math.max(15,baseY-6));ctx.fillText(formatMoney(r.totalInterest),centers[1],Math.max(15,accelY-6));text(ctx,'Traditional payoff',centers[0],h-11,'center');text(ctx,'Acceleration strategy',centers[1],h-11,'center');ctx.fillStyle='#94b598';ctx.font='800 12px Inter,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(`Estimated saved: ${formatMoney(r.interestSaved)}`,w/2,15)}
      function payoffChart(){const canvas=el('payoffChart');if(!canvas)return;const{ctx,w,h}=canvasSize(canvas),r=window.result,p={l:52,r:20,t:18,b:34},cw=w-p.l-p.r,ch=h-p.t-p.b,end=Math.max(r.base.daily.length,r.accel.daily.length)-1,samples=160,points=[];for(let i=0;i<=samples;i++){const index=Math.round(end*i/samples);points.push({traditional:r.base.daily[Math.min(index,r.base.daily.length-1)]?.debt??0,acceleration:r.accel.daily[Math.min(index,r.accel.daily.length-1)]?.debt??0})}const max=Math.max(...points.map(x=>Math.max(x.traditional,x.acceleration)),1);ctx.clearRect(0,0,w,h);grid(ctx,w,h,p,max);const x=i=>p.l+i/samples*cw,y=v=>p.t+ch-v/max*ch;function draw(key,color,dash=[]){ctx.beginPath();points.forEach((point,i)=>{const px=x(i),py=y(point[key]);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)});ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.setLineDash([])}draw('traditional','#918a80',[6,4]);draw('acceleration','#c79a45');const traditionalX=p.l+(r.base.daily.length-1)/end*cw;ctx.setLineDash([3,3]);ctx.strokeStyle='rgba(244,238,226,.34)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(traditionalX,p.t);ctx.lineTo(traditionalX,p.t+ch);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#94b598';ctx.font='800 11px Inter,system-ui,sans-serif';ctx.textAlign='right';ctx.fillText(`${number.format(r.monthsSaved)} mo sooner`,Math.max(p.l+95,traditionalX-5),p.t+14);text(ctx,'Start',p.l,h-10);text(ctx,`Acceleration: ${formatDate(r.accel.paidOff)}`,Math.min(w-p.r-105,p.l+cw*.56),h-10,'center');text(ctx,`Traditional: ${formatDate(r.base.paidOff)}`,w-p.r,h-10,'right')}
      function drawCharts(){interestChart();payoffChart()}
      function render(r){if(r.error){showError(r.error);return}window.result=r;el('results').innerHTML=`<div class="notice success">Projection complete. The Acceleration Account strategy reaches zero on <strong>${formatDate(r.accel.paidOff)}</strong>, compared with a traditional mortgage payoff on <strong>${formatDate(r.base.paidOff)}</strong>.</div><div class="metrics" style="margin-top:14px"><div class="metric"><div class="label">Acceleration payoff date</div><div class="value good">${formatDate(r.accel.paidOff)}</div></div><div class="metric"><div class="label">Acceleration payoff duration</div><div class="value">${r.years} yr ${r.months} mo</div></div><div class="metric"><div class="label">Traditional mortgage payoff</div><div class="value">${formatDate(r.base.paidOff)}</div></div><div class="metric"><div class="label">Estimated time saved</div><div class="value good">${number.format(r.monthsSaved)} mo</div></div><div class="metric"><div class="label">Calculated monthly mortgage payment</div><div class="value">${formatMoney(r.payment)}</div></div><div class="metric"><div class="label">Estimated monthly income</div><div class="value">${formatMoney(r.income)}</div></div><div class="metric"><div class="label">Traditional mortgage interest</div><div class="value">${formatMoney(r.base.interestTotal)}</div></div><div class="metric"><div class="label">Acceleration total interest</div><div class="value">${formatMoney(r.totalInterest)}</div></div><div class="metric"><div class="label">Estimated interest savings</div><div class="value ${r.interestSaved>=0?'good':''}">${formatMoney(r.interestSaved)}</div></div><div class="metric"><div class="label">Account interest paid</div><div class="value">${formatMoney(r.accel.helocInterest)}</div></div></div><div class="section-result"><h3>Projection charts</h3><div class="chart-stack"><div class="chart-card"><p class="chart-title">Interest paid and saved</p><p class="chart-subtitle">Traditional mortgage interest compared with total interest under the Acceleration strategy.</p><div class="chart-wrap"><canvas id="interestChart"></canvas></div><div class="legend"><span><i class="dot" style="background:#8c8883"></i>Traditional mortgage interest</span><span><i class="dot" style="background:#c79a45"></i>Acceleration mortgage interest</span><span><i class="dot" style="background:#24475b"></i>Acceleration Account interest</span></div></div><div class="chart-card"><p class="chart-title">Traditional vs. accelerated payoff</p><p class="chart-subtitle">Traditional mortgage balance compared with total debt in the Acceleration strategy.</p><div class="chart-wrap"><canvas id="payoffChart"></canvas></div><div class="legend"><span><i class="dot" style="background:#918a80"></i>Traditional mortgage amortization</span><span><i class="dot" style="background:#c79a45"></i>Acceleration total debt</span></div></div></div></div><div class="section-result"><p class="small">Educational estimate only. Actual mortgage servicing rules, HELOC billing cycles, annual-day-count conventions, rate changes, fees, payment posting, and lender-specific terms can materially change real results.</p></div>`;requestAnimationFrame(drawCharts)}
      window.addEventListener('resize',()=>{if(window.result)drawCharts()});el('calculatorForm').addEventListener('submit',event=>{event.preventDefault();render(calculate({mortgageBalance:value('mortgageBalance'),mortgageRate:value('mortgageRate'),mortgageYears:value('mortgageYears'),mortgageDay:Number(el('mortgageDay').value),accountCapacity:value('accountCapacity'),currentAccountBalance:value('accountBalance'),accountRate:value('accountRate'),advancePercent:value('advancePercent'),monthlyExpenses:value('monthlyExpenses'),incomes:[1,2,3].map(i=>({amount:value(`income${i}Amount`),frequency:el(`income${i}Frequency`).value}))}))});
    })();
  </script>
